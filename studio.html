<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>TORAMI Content Studio｜写真と旅の記録の編集</title><link rel="stylesheet" href="assets/css/site.css"><link rel="stylesheet" href="assets/css/studio.css"></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="index.html">TORAMI TRAVEL</a><span>CONTENT STUDIO</span></div></header><main class="wrap studio"><header class="page-intro"><p class="eyebrow">YOUR STORIES, YOUR WORDS</p><h1>Content Studio</h1><p class="ja-title">旅の写真と本音を、サイトに加える。</p></header><section class="glass studio-help"><p>ここでの編集は公開サイトを直接変更しません。変更を反映したら「更新用ZIPを書き出す」で保存し、ZIP内のファイルをGitHubの同じ場所へアップロードしてください。</p><p>写真はこの画面を開いている間だけ保持します。閉じる前にZIPを書き出してください。以前書き出した <code>data/content.js</code> は読み込んで編集を続けられます。</p><div class="studio-actions"><label class="button soft">content.jsを読み込む<input id="import-content" type="file" accept=".js,.json" hidden></label><button id="export-content" class="button">更新用ZIPを書き出す ↓</button></div><p id="studio-status" role="status"></p></section><div class="studio-tabs"><button data-panel="countries" aria-pressed="true">国の情報・感想・評価</button><button data-panel="diaries" aria-pressed="false">Diaryの写真・文章</button></div><section id="countries-panel" class="glass studio-panel"><label>編集する国・地域<select id="edit-country"></select></label><form id="country-editor"></form></section><section id="diaries-panel" class="glass studio-panel" hidden><div class="studio-actions"><label>記録を選ぶ<select id="edit-diary"><option value="">新しい記録</option></select></label><button id="new-diary" class="button soft">新しい記録 ＋</button></div><form id="diary-editor"><label>国・地域<select name="country" id="diary-place"></select></label><div class="editor-grid"><label>タイトル<input name="title" required maxlength="150"></label><label>日付<input name="date" type="date" required></label></div><label>ひと言<textarea name="caption" rows="2"></textarea></label><label>本文<textarea name="body" rows="6"></textarea></label><label>感情タグ（カンマ区切り）<input name="emotions" placeholder="心がほどけた, また戻りたい"></label><label>写真を追加（複数選択可・JPEG / PNG / WebP）<input id="diary-photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><div id="photo-edit-list"></div><label class="editor-check"><input name="published" type="checkbox">サイトで公開する</label><p class="fine-print">公開にはタイトル・日付・写真が必要です。写真ごとの説明文も入力できます。</p><button class="button" type="submit">この日記の変更を反映</button></form></section></main><script src="data/content.js" defer></script><script src="assets/js/studio.js" defer></script><script>window.goatcounter={no_onload:location.hostname!=='horami55555.github.io'};</script><script data-goatcounter="https://torami-travel.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script></body></html>
